name: Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests, debug APKs and R8 release check
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E '^e: |error: |FAILED|What went wrong|Execution failed' -A2 build.log | head -60 \
            | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Publish armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: haven-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: haven-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
